name: Bug report
description: Report a reproducible problem.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What should happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the relevant version, environment and smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant logs or screenshots. Remove credentials, tokens and personal data before sharing.
